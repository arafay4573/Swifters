<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Swifters - Matrix Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#000000',
                        matrix: '#00FF66',
                        matrixlight: '#39FF14',
                        borderglass: '#0a2e15',
                    },
                    fontFamily: {
                        sans: ['Space Mono', 'monospace'],
                        display: ['Share Tech Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <!-- Lenis for smooth scrolling -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.39/dist/lenis.min.js"></script>
    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>
<body class="bg-background text-matrix overflow-x-hidden antialiased cursor-none">

    <!-- Custom Cursor -->
    <div id="custom-cursor" class="fixed top-0 left-0 w-8 h-8 pointer-events-none z-[100] flex items-center justify-center mix-blend-screen hidden md:flex">
        <div class="relative w-full h-full">
            <div class="absolute top-1/2 left-0 w-full h-[1px] bg-matrixlight shadow-[0_0_8px_#39FF14]"></div>
            <div class="absolute left-1/2 top-0 w-[1px] h-full bg-matrixlight shadow-[0_0_8px_#39FF14]"></div>
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-4 h-4 border border-matrixlight rounded-full shadow-[0_0_8px_#39FF14]"></div>
        </div>
    </div>

    <!-- Header -->
    <header class="fixed top-0 left-0 w-full z-50 transition-all duration-300">
        <!-- We use a pseudo-element or heavily translucent bg so the text passes through clearly -->
        <div class="absolute inset-0 bg-background/40 backdrop-blur-md border-b border-matrix/20"></div>
        <div class="relative max-w-screen-2xl mx-auto px-6 py-4 flex items-center justify-between">
            <!-- Logo -->
            <a href="#hero" class="flex items-center gap-3 group relative nav-btn-fire px-4 py-2 rounded-md border border-transparent">
                <div class="absolute -inset-2 bg-matrix/20 blur-xl rounded-full opacity-0 group-hover:opacity-100 transition duration-500"></div>
                <img src="assets/images/logo-icon.png" alt="The Swifters Logo" class="h-20 w-auto relative z-10 drop-shadow-[0_0_12px_rgba(0,255,102,0.6)] filter invert sepia saturate-200 hue-rotate-50 brightness-150"> <!-- Adjust image filter to appear green-ish -->
                <span class="font-display text-2xl font-bold text-matrix/70 tracking-widest uppercase relative z-10">The Swifters</span>
            </a>

            <!-- Navigation -->
            <nav class="hidden md:flex items-center gap-2">
                <a href="#about" class="nav-btn nav-btn-fire relative px-5 py-2 text-sm tracking-widest uppercase font-semibold text-matrix/70 hover:text-matrixlight transition-colors duration-300 overflow-hidden rounded-md border border-transparent hover:border-matrix/50">
                    <span class="relative z-10">About Us</span>
                    <div class="absolute inset-0 bg-matrix/10 opacity-0 transition-opacity duration-300"></div>
                </a>
                <a href="#journey" class="nav-btn nav-btn-fire relative px-5 py-2 text-sm tracking-widest uppercase font-semibold text-matrix/70 hover:text-matrixlight transition-colors duration-300 overflow-hidden rounded-md border border-transparent hover:border-matrix/50">
                    <span class="relative z-10">Our Journey</span>
                    <div class="absolute inset-0 bg-matrix/10 opacity-0 transition-opacity duration-300"></div>
                </a>
                <a href="#tech" class="nav-btn nav-btn-fire relative px-5 py-2 text-sm tracking-widest uppercase font-semibold text-matrix/70 hover:text-matrixlight transition-colors duration-300 overflow-hidden rounded-md border border-transparent hover:border-matrix/50">
                    <span class="relative z-10">Our Tech Stack</span>
                    <div class="absolute inset-0 bg-matrix/10 opacity-0 transition-opacity duration-300"></div>
                </a>
                <a href="#projects" class="nav-btn nav-btn-fire relative px-5 py-2 text-sm tracking-widest uppercase font-semibold text-matrix/70 hover:text-matrixlight transition-colors duration-300 overflow-hidden rounded-md border border-transparent hover:border-matrix/50">
                    <span class="relative z-10">Projects</span>
                    <div class="absolute inset-0 bg-matrix/10 opacity-0 transition-opacity duration-300"></div>
                </a>
                <a href="#contact" class="nav-btn nav-btn-fire relative px-5 py-2 text-sm tracking-widest uppercase font-semibold text-matrix/70 hover:text-matrixlight transition-colors duration-300 overflow-hidden rounded-md border border-transparent hover:border-matrix/50">
                    <span class="relative z-10">Contact Us</span>
                    <div class="absolute inset-0 bg-matrix/10 opacity-0 transition-opacity duration-300"></div>
                </a>
            </nav>
        </div>
    </header>

    <!-- Hero Section (First Screen) -->
    <section id="hero" class="relative w-full h-screen flex items-center justify-center overflow-hidden bg-background pt-24">
        <!-- Radial Background -->
        <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-matrix/5 via-background to-background pointer-events-none z-0"></div>

        <!-- Background Tagline Container (Absolutely Centered) -->
        <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none z-0">
            <!-- Completely readable black font with light green stroke/shadow -->
            <div class="text-center w-full max-w-screen-2xl">
                <h1 class="font-display font-bold tracking-widest uppercase mb-4 whitespace-nowrap" style="font-size: 6vw; color: black; -webkit-text-stroke: 1px rgba(0,255,102,0.2); text-shadow: 0 0 10px rgba(0,255,102,0.1); line-height: 1.1;">
                    Quick to create
                </h1>
                <h1 class="font-display font-bold tracking-widest uppercase whitespace-nowrap" style="font-size: 6vw; color: black; -webkit-text-stroke: 1px rgba(0,255,102,0.2); text-shadow: 0 0 10px rgba(0,255,102,0.1); line-height: 1.1;">
                    Bold to innovate
                </h1>
            </div>
        </div>

        <!-- Foreground Group: Logo and Name (Transitions left to right) -->
        <!-- Placed in a container to handle the hover pause and CSS animation -->
        <div class="z-10 w-full h-full flex items-center justify-center hero-foreground-transition">
            <div class="flex flex-col items-center justify-center hero-transition-group cursor-pointer w-full">
                <!-- Glitch Container for Logo -->
                <div class="logo-glitch-container logo-container relative w-full flex justify-center">
                    <!-- Extremely large logo in the middle of the screen, adjusted height so the text below it is completely visible on screen -->
                    <img src="assets/images/logo-icon.png" alt="The Swifters" class="w-full max-w-[850px] max-h-[60vh] object-contain logo-dark-idle z-10 relative">

                    <!-- Glitch Layers -->
                    <img src="assets/images/logo-icon.png" alt="" class="glitch-layer gl-1 absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-[850px] max-h-[60vh] object-contain filter invert sepia saturate-200 hue-rotate-50 brightness-150 mix-blend-screen pointer-events-none">
                    <img src="assets/images/logo-icon.png" alt="" class="glitch-layer gl-2 absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-[850px] max-h-[60vh] object-contain filter invert sepia saturate-200 hue-rotate-50 brightness-150 mix-blend-screen pointer-events-none">
                </div>

                <!-- The Swifters Name Below Logo (Pulled up closer with negative margin) -->
                <h2 class="font-display text-5xl md:text-7xl font-bold tracking-widest text-matrixlight drop-shadow-[0_0_15px_rgba(57,255,20,0.8)] uppercase -mt-4 md:-mt-8">
                    The Swifters
                </h2>
            </div>
        </div>
    </section>

    <!-- Main Content Panels -->
    <main class="relative z-10 pt-32 pb-32 space-y-40 max-w-screen-xl mx-auto px-6">

        <!-- About Us Section -->
        <section id="about" class="panel min-h-[60vh] flex items-center">
            <div class="matrix-panel glow-on-hover p-12 md:p-16 w-full relative group bg-background/80 backdrop-blur-sm border border-matrix/20">
                <div class="absolute -inset-[1px] bg-gradient-to-r from-matrix/50 to-transparent opacity-0 group-hover:opacity-100 transition duration-500 pointer-events-none"></div>

                <h2 class="font-display text-5xl md:text-7xl font-bold mb-6 text-matrix drop-shadow-[0_0_8px_rgba(0,255,102,0.5)]">> About_Us</h2>
                <div class="w-full h-[1px] bg-matrix/30 mb-8 relative">
                    <div class="absolute left-0 top-0 h-full w-24 bg-matrix shadow-[0_0_10px_#00FF66]"></div>
                </div>
                <p class="text-xl text-matrix/70 max-w-2xl leading-relaxed font-sans">
                    <!-- Drop your 'About Us' data here -->
                    [Your Content Here]
                </p>
            </div>
        </section>

        <!-- Our Journey Section -->
        <section id="journey" class="panel min-h-[60vh] flex items-center justify-end">
            <div class="matrix-panel glow-on-hover p-12 md:p-16 w-full md:w-3/4 relative group bg-background/80 backdrop-blur-sm border border-matrix/20">
                <div class="absolute -inset-[1px] bg-gradient-to-l from-matrix/50 to-transparent opacity-0 group-hover:opacity-100 transition duration-500 pointer-events-none"></div>

                <h2 class="font-display text-5xl md:text-7xl font-bold mb-6 text-matrix drop-shadow-[0_0_8px_rgba(0,255,102,0.5)]">> Our_Journey</h2>
                <div class="w-full h-[1px] bg-matrix/30 mb-8 relative flex justify-end">
                    <div class="absolute right-0 top-0 h-full w-24 bg-matrix shadow-[0_0_10px_#00FF66]"></div>
                </div>
                <p class="text-xl text-matrix/70 max-w-2xl leading-relaxed font-sans text-right ml-auto">
                    <!-- Drop your 'Journey' data here -->
                    [Your Content Here]
                </p>
            </div>
        </section>

        <!-- Our Tech Stack Section -->
        <section id="tech" class="panel min-h-[60vh] flex items-center">
            <div class="matrix-panel glow-on-hover p-12 md:p-16 w-full md:w-3/4 relative group bg-background/80 backdrop-blur-sm border border-matrix/20">
                 <div class="absolute -inset-[1px] bg-gradient-to-r from-matrix/50 to-transparent opacity-0 group-hover:opacity-100 transition duration-500 pointer-events-none"></div>

                <h2 class="font-display text-5xl md:text-7xl font-bold mb-6 text-matrix drop-shadow-[0_0_8px_rgba(0,255,102,0.5)]">> Tech_Stack</h2>
                <div class="w-full h-[1px] bg-matrix/30 mb-8 relative">
                    <div class="absolute left-0 top-0 h-full w-24 bg-matrix shadow-[0_0_10px_#00FF66]"></div>
                </div>
                <p class="text-xl text-matrix/70 max-w-2xl leading-relaxed font-sans">
                    <!-- Drop your 'Tech Stack' data here -->
                    [Your Content Here]
                </p>
            </div>
        </section>

        <!-- Projects Section -->
        <section id="projects" class="panel min-h-[60vh] flex items-center justify-end">
            <div class="matrix-panel glow-on-hover p-12 md:p-16 w-full relative group bg-background/80 backdrop-blur-sm border border-matrix/20">
                <div class="absolute -inset-[1px] bg-gradient-to-l from-matrix/50 to-transparent opacity-0 group-hover:opacity-100 transition duration-500 pointer-events-none"></div>

                <h2 class="font-display text-5xl md:text-7xl font-bold mb-6 text-matrix drop-shadow-[0_0_8px_rgba(0,255,102,0.5)]">> Projects</h2>
                 <div class="w-full h-[1px] bg-matrix/30 mb-8 relative flex justify-end">
                    <div class="absolute right-0 top-0 h-full w-24 bg-matrix shadow-[0_0_10px_#00FF66]"></div>
                </div>
                <p class="text-xl text-matrix/70 max-w-2xl leading-relaxed font-sans text-right ml-auto">
                    <!-- Drop your 'Projects' data here -->
                    [Your Content Here]
                </p>
            </div>
        </section>

        <!-- Contact Us Section -->
        <section id="contact" class="panel min-h-[60vh] flex items-center justify-center">
            <div class="matrix-panel glow-on-hover p-12 md:p-16 w-full text-center relative group bg-background/80 backdrop-blur-sm border border-matrix/20">
                <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-matrix/10 to-transparent opacity-0 group-hover:opacity-100 transition duration-500 pointer-events-none"></div>

                <h2 class="font-display text-5xl md:text-7xl font-bold mb-6 text-matrix drop-shadow-[0_0_8px_rgba(0,255,102,0.5)]">> Contact_Us</h2>
                <div class="w-48 h-[1px] bg-matrix/30 mx-auto mb-8 relative">
                    <div class="absolute left-1/2 -translate-x-1/2 top-0 h-full w-12 bg-matrix shadow-[0_0_10px_#00FF66]"></div>
                </div>
                <p class="text-xl text-matrix/70 max-w-2xl mx-auto leading-relaxed font-sans">
                    <!-- Drop your 'Contact Us' data here -->
                    [Your Content Here]
                </p>
            </div>
        </section>

    </main>

    <script src="main.js"></script>
</body>
</html>
