<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Swifters - Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#0B0B0F',
                        cyan: '#06B6D4',
                        violet: '#7C3AED',
                        borderglass: '#1E293B',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Oswald', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <!-- Lenis for smooth scrolling -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.39/dist/lenis.min.js"></script>
    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>
<body class="bg-background text-gray-200 overflow-x-hidden antialiased">

    <!-- Header will go here -->
    <!-- Header -->
    <header class="fixed top-0 left-0 w-full z-50 glass-header transition-all duration-300">
        <div class="max-w-screen-2xl mx-auto px-6 py-4 flex items-center justify-between">
            <!-- Logo -->
            <a href="#" class="flex items-center gap-3 group relative">
                <div class="absolute -inset-2 bg-cyan/20 blur-xl rounded-full opacity-0 group-hover:opacity-100 transition duration-500"></div>
                <img src="assets/images/logo-icon.png" alt="The Swifters Logo" class="h-12 w-auto relative z-10 drop-shadow-[0_0_8px_rgba(6,182,212,0.5)]">
            </a>

            <!-- Navigation -->
            <nav class="hidden md:flex items-center gap-2">
                <a href="#about" class="nav-btn relative px-5 py-2 text-sm tracking-widest uppercase font-semibold text-gray-300 hover:text-white transition-colors duration-300 overflow-hidden rounded-md">
                    <span class="relative z-10">About Us</span>
                    <div class="absolute inset-0 bg-gradient-to-r from-cyan/20 to-violet/20 opacity-0 transition-opacity duration-300"></div>
                </a>
                <a href="#journey" class="nav-btn relative px-5 py-2 text-sm tracking-widest uppercase font-semibold text-gray-300 hover:text-white transition-colors duration-300 overflow-hidden rounded-md">
                    <span class="relative z-10">Our Journey</span>
                    <div class="absolute inset-0 bg-gradient-to-r from-cyan/20 to-violet/20 opacity-0 transition-opacity duration-300"></div>
                </a>
                <a href="#tech" class="nav-btn relative px-5 py-2 text-sm tracking-widest uppercase font-semibold text-gray-300 hover:text-white transition-colors duration-300 overflow-hidden rounded-md">
                    <span class="relative z-10">Our Tech Stack</span>
                    <div class="absolute inset-0 bg-gradient-to-r from-cyan/20 to-violet/20 opacity-0 transition-opacity duration-300"></div>
                </a>
                <a href="#projects" class="nav-btn relative px-5 py-2 text-sm tracking-widest uppercase font-semibold text-gray-300 hover:text-white transition-colors duration-300 overflow-hidden rounded-md">
                    <span class="relative z-10">Projects</span>
                    <div class="absolute inset-0 bg-gradient-to-r from-cyan/20 to-violet/20 opacity-0 transition-opacity duration-300"></div>
                </a>
                <a href="#contact" class="nav-btn relative px-5 py-2 text-sm tracking-widest uppercase font-semibold text-gray-300 hover:text-white transition-colors duration-300 overflow-hidden rounded-md">
                    <span class="relative z-10">Contact Us</span>
                    <div class="absolute inset-0 bg-gradient-to-r from-cyan/20 to-violet/20 opacity-0 transition-opacity duration-300"></div>
                </a>
            </nav>
        </div>
    </header>

    <!-- Background Tagline -->
    <!-- Kinetic Background Tagline -->
    <div class="fixed top-0 left-0 w-full h-screen pointer-events-none z-0 flex items-center justify-center overflow-hidden">
        <h1 id="kinetic-tagline" class="text-outline font-display text-[15vw] leading-none whitespace-nowrap opacity-20 select-none">
            QUICK TO CREATE, BOLD TO INNOVATE &nbsp; QUICK TO CREATE, BOLD TO INNOVATE
        </h1>
    </div>

    <!-- Content Panels -->
    <!-- Main Content Panels -->
    <main class="relative z-10 pt-32 pb-32 space-y-40 max-w-screen-xl mx-auto px-6">

        <!-- About Us Section -->
        <section id="about" class="panel min-h-[60vh] flex items-center">
            <div class="glass-panel glow-on-hover p-12 md:p-16 rounded-2xl w-full relative group">
                <!-- Hover Illumination -->
                <div class="absolute inset-0 bg-gradient-to-br from-cyan/5 to-violet/5 opacity-0 group-hover:opacity-100 transition-opacity duration-700 rounded-2xl pointer-events-none"></div>

                <h2 class="font-display text-5xl md:text-7xl font-bold mb-6 text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-500">About Us</h2>
                <div class="w-24 h-1 bg-cyan mb-8"></div>
                <p class="text-xl text-gray-400 max-w-2xl leading-relaxed">
                    <!-- Drop your 'About Us' data here -->
                    [Your Content Here]
                </p>
            </div>
        </section>

        <!-- Our Journey Section -->
        <section id="journey" class="panel min-h-[60vh] flex items-center justify-end">
            <div class="glass-panel glow-on-hover p-12 md:p-16 rounded-2xl w-full md:w-3/4 relative group">
                <div class="absolute inset-0 bg-gradient-to-bl from-violet/5 to-cyan/5 opacity-0 group-hover:opacity-100 transition-opacity duration-700 rounded-2xl pointer-events-none"></div>

                <h2 class="font-display text-5xl md:text-7xl font-bold mb-6 text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-500">Our Journey</h2>
                <div class="w-24 h-1 bg-violet mb-8"></div>
                <p class="text-xl text-gray-400 max-w-2xl leading-relaxed">
                    <!-- Drop your 'Journey' data here -->
                    [Your Content Here]
                </p>
            </div>
        </section>

        <!-- Our Tech Stack Section -->
        <section id="tech" class="panel min-h-[60vh] flex items-center">
            <div class="glass-panel glow-on-hover p-12 md:p-16 rounded-2xl w-full md:w-3/4 relative group">
                <div class="absolute inset-0 bg-gradient-to-br from-cyan/5 to-violet/5 opacity-0 group-hover:opacity-100 transition-opacity duration-700 rounded-2xl pointer-events-none"></div>

                <h2 class="font-display text-5xl md:text-7xl font-bold mb-6 text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-500">Tech Stack</h2>
                <div class="w-24 h-1 bg-cyan mb-8"></div>
                <p class="text-xl text-gray-400 max-w-2xl leading-relaxed">
                    <!-- Drop your 'Tech Stack' data here -->
                    [Your Content Here]
                </p>
            </div>
        </section>

        <!-- Projects Section -->
        <section id="projects" class="panel min-h-[60vh] flex items-center justify-end">
            <div class="glass-panel glow-on-hover p-12 md:p-16 rounded-2xl w-full relative group">
                <div class="absolute inset-0 bg-gradient-to-bl from-violet/5 to-cyan/5 opacity-0 group-hover:opacity-100 transition-opacity duration-700 rounded-2xl pointer-events-none"></div>

                <h2 class="font-display text-5xl md:text-7xl font-bold mb-6 text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-500">Projects</h2>
                <div class="w-24 h-1 bg-violet mb-8"></div>
                <p class="text-xl text-gray-400 max-w-2xl leading-relaxed">
                    <!-- Drop your 'Projects' data here -->
                    [Your Content Here]
                </p>
            </div>
        </section>

        <!-- Contact Us Section -->
        <section id="contact" class="panel min-h-[60vh] flex items-center justify-center">
            <div class="glass-panel glow-on-hover p-12 md:p-16 rounded-2xl w-full text-center relative group">
                <div class="absolute inset-0 bg-gradient-to-t from-cyan/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-700 rounded-2xl pointer-events-none"></div>

                <h2 class="font-display text-5xl md:text-7xl font-bold mb-6 text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-500">Contact Us</h2>
                <div class="w-24 h-1 bg-gradient-to-r from-cyan to-violet mx-auto mb-8"></div>
                <p class="text-xl text-gray-400 max-w-2xl mx-auto leading-relaxed">
                    <!-- Drop your 'Contact Us' data here -->
                    [Your Content Here]
                </p>
            </div>
        </section>

    </main>

    <script src="main.js"></script>
</body>
</html>
